name: CD — gated apps

# A push builds a new revision of each affected gated app with no traffic and a tag.
# A person starts the traffic files by hand. No job here moves traffic.
on:
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".pnpmfile.cjs"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  select:
    name: Select affected apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout Repository 📂
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same step text sits in cd-www-reading-advantage.yml. The table scripts/ci/apps.json is the one source.
      - name: Select affected apps
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ids="$(node scripts/ci/affected-apps.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "affected: $ids"
          AFFECTED_IDS="$ids" node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const ids = JSON.parse(process.env.AFFECTED_IDS);
            const rows = JSON.parse(readFileSync("scripts/ci/apps.json", "utf8"));
            const hit = (row) => ids.includes(row.id);
            const www = rows.some((row) => row.mode === "direct" && hit(row));
            // A push file may declare a REQUIRED_ default for _RELEASE_COMMIT_SHA. The job passes the
            // pushed commit only when that is the one such default in the file (other defaults would
            // still fail the build, and Cloud Build refuses a substitution that the file does not declare).
            const substitutions = (file) => {
              if (!existsSync(file)) return "";
              const text = readFileSync(file, "utf8");
              const required = [...text.matchAll(/^  (_[A-Z0-9_]+): "REQUIRED_/gm)].map((match) => match[1]);
              const only = required.length === 1 && required[0] === "_RELEASE_COMMIT_SHA";
              return only ? "--substitutions=_RELEASE_COMMIT_SHA=" + process.env.HEAD_SHA : "";
            };
            const matrix = rows
              .filter((row) => row.mode === "gated" && hit(row))
              .map(({ id, service, project, cloudbuild }) => ({
                id,
                service,
                project,
                cloudbuild,
                substitutions: substitutions(cloudbuild),
              }));
            console.log("www=" + (www ? "yes" : "no"));
            console.log("matrix=" + JSON.stringify(matrix));
          ' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }} with no traffic
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout Repository 📂
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: "auth"
        name: Authenticate with Google Cloud 🔑
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set Up Google Cloud SDK ☁️
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ matrix.project }}

      - name: Submit Cloud Build 🐳
        run: |
          gcloud builds submit \
            --project="${{ matrix.project }}" \
            --config="${{ matrix.cloudbuild }}" \
            ${{ matrix.substitutions }} \
            .
