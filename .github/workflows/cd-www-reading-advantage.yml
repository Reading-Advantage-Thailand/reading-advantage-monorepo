name: CD — www-reading-advantage

on:
  push:
    branches:
      - master
    paths:
      - "apps/www-reading-advantage/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

jobs:
  select:
    name: Select affected apps
    runs-on: ubuntu-latest
    outputs:
      www: ${{ steps.select.outputs.www }}
    steps:
      - name: Checkout Repository 📂
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same step text sits in cd-apps.yml. The table scripts/ci/apps.json is the one source.
      - name: Select affected apps
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ids="$(node scripts/ci/affected-apps.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "affected: $ids"
          AFFECTED_IDS="$ids" node -e '
            const { existsSync, readFileSync } = require("node:fs");
            const ids = JSON.parse(process.env.AFFECTED_IDS);
            const rows = JSON.parse(readFileSync("scripts/ci/apps.json", "utf8"));
            const hit = (row) => ids.includes(row.id);
            const www = rows.some((row) => row.id === "www-reading-advantage" && row.mode === "direct" && hit(row));
            // A push file may declare a REQUIRED_ default for _RELEASE_COMMIT_SHA. The job passes the
            // pushed commit only when that is the one such default in the file (other defaults would
            // still fail the build, and Cloud Build refuses a substitution that the file does not declare).
            const substitutions = (file) => {
              if (!existsSync(file)) return "";
              const text = readFileSync(file, "utf8");
              const required = [...text.matchAll(/^  (_[A-Z0-9_]+): "REQUIRED_/gm)].map((match) => match[1]);
              const only = required.length === 1 && required[0] === "_RELEASE_COMMIT_SHA";
              return only ? "--substitutions=_RELEASE_COMMIT_SHA=" + process.env.HEAD_SHA : "";
            };
            const matrix = rows
              .filter((row) => row.id !== "www-reading-advantage" && ["direct", "gated"].includes(row.mode) && hit(row))
              .map(({ id, service, project, cloudbuild }) => ({
                id,
                service,
                project,
                cloudbuild,
                substitutions: substitutions(cloudbuild),
              }));
            // An excluded row of an affected range prints one skip line on stderr. The line names the row and the reason. It does not enter GITHUB_OUTPUT.
            for (const row of rows) {
              if (row.mode === "excluded" && hit(row)) {
                console.error("skip=" + row.id + " reason=" + row.reason);
              }
            }
            console.log("www=" + (www ? "yes" : "no"));
            console.log("matrix=" + JSON.stringify(matrix));
          ' >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloud Run 🚀
    needs: select
    if: needs.select.outputs.www == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 📂
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Track www_products_photos_20261115 (AC-3b): the photo e2e runs against the app
      # built here, before the deploy step, so a photo that a reader cannot see stops
      # the deploy. A "CD needs CI" link would stop every www deploy, because ci.yml is
      # red on master for an unrelated cause (the architecture check).
      - name: Set Up pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: true

      - name: Set Up Node for the photo e2e
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the www app for the photo e2e
        run: pnpm turbo run build --filter=www-reading-advantage...

      - name: Install Chrome for the www photo e2e
        run: pnpm --filter www-reading-advantage exec playwright install --with-deps chromium

      - name: Start the www app for the photo e2e
        working-directory: apps/www-reading-advantage
        run: |
          pnpm exec next start -p 3123 > /tmp/www-next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:3123/en; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/www-next-start.log
          exit 1

      - name: Run the www photo e2e
        run: BASE_URL=http://localhost:3123 pnpm --filter www-reading-advantage exec playwright test e2e/photos.spec.ts

      - id: "auth"
        name: Authenticate with Google Cloud 🔑
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set Up Google Cloud SDK ☁️
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Submit Cloud Build 🐳
        run: |
          gcloud builds submit \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --config="apps/www-reading-advantage/cloudbuild.yaml" \
            .

      - name: Display Deployment URL 📋
        run: |
          echo "Application successfully deployed to Cloud Run"
          gcloud run services describe www-reading-advantage \
            --platform managed \
            --region asia-southeast1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format='value(status.url)'
