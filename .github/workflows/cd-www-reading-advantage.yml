name: CD — www-reading-advantage

on:
  push:
    branches:
      - master
    paths:
      - "apps/www-reading-advantage/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

jobs:
  select:
    name: Select affected apps
    runs-on: ubuntu-latest
    outputs:
      www: ${{ steps.select.outputs.www }}
    steps:
      - name: Checkout Repository 📂
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same step text sits in cd-apps.yml. The table scripts/ci/apps.json is the one source.
      - name: Select affected apps
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ids="$(node scripts/ci/affected-apps.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "affected: $ids"
          AFFECTED_IDS="$ids" node -e '
            const { readFileSync } = require("node:fs");
            const ids = JSON.parse(process.env.AFFECTED_IDS);
            const rows = JSON.parse(readFileSync("scripts/ci/apps.json", "utf8"));
            const hit = (row) => ids.includes(row.id);
            const www = rows.some((row) => row.mode === "direct" && hit(row));
            const matrix = rows
              .filter((row) => row.mode === "gated" && hit(row))
              .map(({ id, service, project, cloudbuild }) => ({ id, service, project, cloudbuild }));
            console.log("www=" + (www ? "yes" : "no"));
            console.log("matrix=" + JSON.stringify(matrix));
          ' >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloud Run 🚀
    needs: select
    if: needs.select.outputs.www == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 📂
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: "auth"
        name: Authenticate with Google Cloud 🔑
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set Up Google Cloud SDK ☁️
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Submit Cloud Build 🐳
        run: |
          gcloud builds submit \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --config="apps/www-reading-advantage/cloudbuild.yaml" \
            .

      - name: Display Deployment URL 📋
        run: |
          echo "Application successfully deployed to Cloud Run"
          gcloud run services describe www-reading-advantage \
            --platform managed \
            --region asia-southeast1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format='value(status.url)'
