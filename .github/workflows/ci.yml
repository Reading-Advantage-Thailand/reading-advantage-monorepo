name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check graph.db
        run: |
          # graph.db is gitignored — rebuild it before checking.
          # Requires build-graph on the CI runner PATH.
          if command -v build-graph &>/dev/null; then
            build-graph scan . ./graph.db
            ./scripts/ci/check-graph-db.sh
          else
            echo "::warning::build-graph not found on PATH — skipping graph.db check."
            echo "Install build-graph or add it to the CI runner image."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Config drift check
        run: pnpm config-drift

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
