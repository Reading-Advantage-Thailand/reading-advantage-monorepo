# Manual traffic step of the codecamp-advantage app (decision D7 of the track per_app_cicd_20261107).
#
# A person starts this file by hand, on Daniel's word. No workflow runs it. It changes the
# production database of codecamp-advantage and then moves traffic to the revision that a push built with
# --no-traffic. The tag is sso-candidate: the latest push owns it.
#
# Order: release source bind, migrate, doctor check, review worker scheduler, traffic move.
# See docs/runbooks/traffic-moves.md.
steps:
  # The first step compares the uploaded repository root with the release commit and stops the
  # build before any step that reads the source.
  - name: "gcr.io/cloud-builders/git"
    id: "bind-release-source"
    entrypoint: "bash"
    args:
      - "scripts/ci/verify-traffic-source.sh"
      - "$_RELEASE_COMMIT_SHA"
      - "https://github.com/Reading-Advantage-Thailand/reading-advantage-monorepo.git"
      - "."

  # CODECAMP_DATABASE_URL is a Cloud SQL unix-socket URL
  # (?host=/cloudsql/<instance>). Cloud Build steps have no /cloudsql socket,
  # so migrate/doctor start the Cloud SQL Auth Proxy (IAM-authenticated,
  # session-mode direct connection — no transaction pooler) listening on the
  # same /cloudsql path the runtime uses; the secret URL then works as-is.
  - name: "node:22-slim"
    id: "migrate-db"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates postgresql-client >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && pnpm install --frozen-lockfile && export DATABASE_URL="$$CODECAMP_DATABASE_URL" && export DIRECT_DATABASE_URL="$$CODECAMP_DATABASE_URL" && export MIGRATION_CEILING_TAG=0059_game_challenges && pnpm --filter @reading-advantage/db migrate'
    secretEnv:
      - "CODECAMP_DATABASE_URL"

  - name: "node:22-slim"
    id: "doctor-check"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates postgresql-client >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && pnpm install --frozen-lockfile && export DATABASE_URL="$$CODECAMP_DATABASE_URL" && export DIRECT_DATABASE_URL="$$CODECAMP_DATABASE_URL" && pnpm --filter @reading-advantage/db doctor --check --required-migration 0049_codecamp_exercise_quiz_repair && test "$$(psql "$$CODECAMP_DATABASE_URL" -Atc "select to_regprocedure(''public.sync_codecamp_company_principal(uuid,text,uuid,text,text)'') is not null")" = t'
    secretEnv:
      - "CODECAMP_DATABASE_URL"

  # The scheduler step runs last but one. It creates or updates the review worker tick job on the
  # live host. A failed step stops the build before the traffic move.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-review-worker-scheduler"
    entrypoint: "bash"
    args:
      - "-c"
      - "./apps/codecamp-advantage/scripts/configure-review-worker-scheduler.sh"
    env:
      - "PROJECT_ID=$PROJECT_ID"
    secretEnv:
      - "CODECAMP_REVIEW_WORKER_TICK_TOKEN"

  # The traffic move runs last. It sends all traffic to the tagged revision of the push.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "update-traffic"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "codecamp-advantage"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--to-tags=sso-candidate=100"

substitutions:
  _RELEASE_COMMIT_SHA: "REQUIRED_RELEASE_COMMIT_SHA"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/CODECAMP_DATABASE_URL/versions/latest"
      env: "CODECAMP_DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/CODECAMP_REVIEW_WORKER_TICK_TOKEN/versions/latest"
      env: "CODECAMP_REVIEW_WORKER_TICK_TOKEN"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
