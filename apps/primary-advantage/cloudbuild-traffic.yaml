# Manual traffic step of the Primary app (decision D1 of the track per_app_cicd_20261107).
#
# A person starts this file by hand, on Daniel's word. No workflow runs it. It changes the
# production database of Primary and then moves traffic to the revision that a push built with
# --no-traffic. Daniel's word supplies _TAG, for example pa-1a2b3c4d.
#
# Order: release source bind, read-only guard, migrate, doctor check, traffic move.
# See docs/runbooks/traffic-moves.md.
steps:
  # The first step compares the uploaded repository root with the release commit and stops the
  # build before any step that reads the source.
  - name: "gcr.io/cloud-builders/git"
    id: "bind-release-source"
    entrypoint: "bash"
    args:
      - "scripts/ci/verify-traffic-source.sh"
      - "$_RELEASE_COMMIT_SHA"
      - "https://github.com/Reading-Advantage-Thailand/reading-advantage-monorepo.git"
      - "."

  # DATABASE_URL is a Cloud SQL unix-socket URL (?host=/cloudsql/<instance>) held
  # in its own secret, PRIMARY_V2_DATABASE_URL. Never point the legacy
  # DATABASE_URL secret at the new database: a legacy rollback revision uses it.
  # Cloud Build steps have no /cloudsql socket, so each step starts the Cloud SQL
  # Auth Proxy on the same /cloudsql path the runtime uses.
  # Read-only guard after the bind step: never migrate the legacy Primary database
  # (Tutor reads it). Then migrate, then fail closed unless the ledger matches
  # the journal and the latest migration is applied. All run before the traffic move.
  - name: "node:22-slim"
    id: "refuse-legacy-db"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export DIRECT_DATABASE_URL=\"$$DATABASE_URL\" && pnpm --filter @reading-advantage/db refuse-legacy-db"
    secretEnv:
      - "DATABASE_URL"

  - name: "node:22-slim"
    id: "migrate-db"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export DIRECT_DATABASE_URL=\"$$DATABASE_URL\" && pnpm --filter @reading-advantage/db migrate"
    secretEnv:
      - "DATABASE_URL"

  - name: "node:22-slim"
    id: "doctor-check"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export DIRECT_DATABASE_URL=\"$$DATABASE_URL\" && pnpm --filter @reading-advantage/db doctor --check --required-migration 0074_primary_help_events"
    secretEnv:
      - "DATABASE_URL"

  # The traffic move runs last. It sends all traffic to the tagged revision of the push.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "update-traffic"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "primary-advantage-app"
      - "--project=${_PROJECT_ID}"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--to-tags=${_TAG}=100"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/${_DATABASE_URL}/versions/latest"
      env: "DATABASE_URL"

substitutions:
  _RELEASE_COMMIT_SHA: "REQUIRED_RELEASE_COMMIT_SHA"
  _PROJECT_ID: "primary-advantage"
  _DATABASE_URL: "PRIMARY_V2_DATABASE_URL"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
