# Manual traffic step of the accounting app (decision D7 of the track per_app_cicd_20261107).
#
# A person starts this file by hand, on Daniel's word. No workflow runs it. It changes the
# production database of accounting and then moves traffic to the revision that a push built with
# --no-traffic. The tag is candidate: the latest push owns it.
#
# Order: migrate, doctor check, runtime probe, traffic move.
# See docs/runbooks/traffic-moves.md.
steps:
  - name: "node:22-slim"
    id: "migrate-db"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export ACCOUNTING_DIRECT_DATABASE_URL="$$ACCOUNTING_DIRECT_DATABASE_URL" && pnpm --filter @reading-advantage/db accounting:migrate'
    secretEnv:
      - "ACCOUNTING_DIRECT_DATABASE_URL"

  - name: "node:22-slim"
    id: "doctor-check"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export ACCOUNTING_DIRECT_DATABASE_URL="$$ACCOUNTING_DIRECT_DATABASE_URL" && pnpm --filter @reading-advantage/db accounting:doctor'
    secretEnv:
      - "ACCOUNTING_DIRECT_DATABASE_URL"

  - name: "node:22-slim"
    id: "runtime-db-contract"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates postgresql-client >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && probe_owner_id="$$(cat /proc/sys/kernel/random/uuid)" && cleanup() { psql "$$ACCOUNTING_DIRECT_DATABASE_URL" -v probe_owner_id="$$probe_owner_id" -f apps/accounting/scripts/accounting-runtime-probe-cleanup.sql; } && trap cleanup EXIT && psql "$$ACCOUNTING_DIRECT_DATABASE_URL" -f apps/accounting/scripts/accounting-runtime-grants.sql && psql "$$ACCOUNTING_DATABASE_URL" -v probe_owner_id="$$probe_owner_id" -f apps/accounting/scripts/accounting-runtime-probe.sql && cleanup && trap - EXIT'
    secretEnv:
      - "ACCOUNTING_DIRECT_DATABASE_URL"
      - "ACCOUNTING_DATABASE_URL"

  # The traffic move runs last. It sends all traffic to the tagged revision of the push.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "update-traffic"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "accounting"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--to-tags=candidate=100"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/ACCOUNTING_DIRECT_DATABASE_URL/versions/latest"
      env: "ACCOUNTING_DIRECT_DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/ACCOUNTING_DATABASE_URL/versions/latest"
      env: "ACCOUNTING_DATABASE_URL"

options:
  env:
    - "pnpm_config_verify_deps_before_run=warn"
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
