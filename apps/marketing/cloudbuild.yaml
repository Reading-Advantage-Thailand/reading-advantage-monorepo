steps:
  # ── Build image ──────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-f"
      - "apps/marketing/Dockerfile"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/containers/marketing:$BUILD_ID"
      - "."

  # ── Push image ───────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/containers/marketing:$BUILD_ID"

  # ── Migrate database ─────────────────────────────────────────────────
  # Runs ALL pending Drizzle migrations against the production Cloud SQL
  # instance. Marketing tables are defined in migration 0021_sales_advantage
  # and schema/marketing.ts.
  - name: "node:22-slim"
    id: "migrate-db"
    entrypoint: "bash"
    args:
      - "-c"
      - >-
        corepack enable &&
        corepack prepare pnpm@11.8.0 --activate &&
        pnpm install --frozen-lockfile &&
        export DATABASE_URL="$$DIRECT_DATABASE_URL" &&
        pnpm --filter @reading-advantage/db migrate
    secretEnv:
      - "DIRECT_DATABASE_URL"

  # ── Doctor check ─────────────────────────────────────────────────────
  # Validates migration ledger integrity before the new code is deployed.
  - name: "node:22-slim"
    id: "doctor-check"
    entrypoint: "bash"
    args:
      - "-c"
      - >-
        corepack enable &&
        corepack prepare pnpm@11.8.0 --activate &&
        pnpm install --frozen-lockfile &&
        export DATABASE_URL="$$DIRECT_DATABASE_URL" &&
        pnpm --filter @reading-advantage/db doctor --check
    secretEnv:
      - "DIRECT_DATABASE_URL"

  # ── Deploy to Cloud Run ──────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-cloudrun"
    args:
      - "run"
      - "deploy"
      - "marketing"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/containers/marketing:$BUILD_ID"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      # Cloud SQL instance — TBD; see plan.md provisioning task
      - "--add-cloudsql-instances=$PROJECT_ID:asia-southeast1:cloud-sql"
      - "--set-env-vars=NODE_ENV=production"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,AI_PROVIDER=AI_PROVIDER:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest"

  # ── Allow public access ──────────────────────────────────────────────
  # The Cloud Run service is unauthenticated (login page must load before
  # session auth). Cloud Run IAM controls who can invoke the URL.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "allow-public-invoker"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "marketing"
      - "--region=asia-southeast1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/containers/marketing:$BUILD_ID"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/DIRECT_DATABASE_URL/versions/latest"
      env: "DIRECT_DATABASE_URL"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
