steps:
  - name: "bash:5.2"
    id: "validate-release-input"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && release_commit_sha="$_RELEASE_COMMIT_SHA" && [[ "$$release_commit_sha" =~ ^[0-9a-f]{40}$$ ]] || { echo "_RELEASE_COMMIT_SHA must be the exact lowercase 40-character source commit" >&2; exit 2; }'

  # ── Build image ──────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-f"
      - "apps/marketing/Dockerfile"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/marketing/marketing:$BUILD_ID"
      - "."

  # ── Push image ───────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/marketing/marketing:$BUILD_ID"

  # ── Migrate database ─────────────────────────────────────────────────
  # The build worker does not receive a Cloud Run /cloudsql mount. Start the
  # pinned Cloud SQL Auth Proxy on the same Unix-socket path used by the
  # production URL, then run migrations through the direct connection secret.
  - name: "node:22-slim"
    id: "migrate-db"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export DATABASE_URL=\"$$MARKETING_DIRECT_DATABASE_URL\" && export DIRECT_DATABASE_URL=\"$$MARKETING_DIRECT_DATABASE_URL\" && pnpm --filter @reading-advantage/db migrate"
    secretEnv:
      - "MARKETING_DIRECT_DATABASE_URL"

  # ── Doctor check ─────────────────────────────────────────────────────
  # Validates migration ledger integrity before the new code is deployed.
  - name: "node:22-slim"
    id: "doctor-check"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export DATABASE_URL=\"$$MARKETING_DIRECT_DATABASE_URL\" && export DIRECT_DATABASE_URL=\"$$MARKETING_DIRECT_DATABASE_URL\" && pnpm --filter @reading-advantage/db doctor --check --required-migration 0042_company_product_principal_local_unique"
    secretEnv:
      - "MARKETING_DIRECT_DATABASE_URL"

  # Apply the reviewed, table-specific runtime grants and prove the runtime
  # credential can use only Marketing application relations before traffic
  # moves. Employee authentication and sessions are owned by Accounts over OIDC.
  - name: "node:22-slim"
    id: "runtime-db-contract"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates postgresql-client >/dev/null && curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64 && chmod +x /usr/local/bin/cloud-sql-proxy && mkdir -p /cloudsql && (cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &) && sleep 5 && psql \"$$MARKETING_DIRECT_DATABASE_URL\" -f apps/marketing/scripts/marketing-runtime-grants.sql && psql \"$$MARKETING_DATABASE_URL\" -f apps/marketing/scripts/marketing-runtime-probe.sql"
    secretEnv:
      - "MARKETING_DIRECT_DATABASE_URL"
      - "MARKETING_DATABASE_URL"

  # Preserve the exact serving revision and immutable image before creating a
  # candidate so the release log contains a directly executable rollback.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "capture-current-release"
    entrypoint: "bash"
    args:
      - "apps/marketing/scripts/capture-marketing-cloud-run-release.sh"
      - "current"
      - "/workspace/.marketing-previous"

  # Create a build-unique candidate URL without changing production traffic.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-candidate"
    args:
      - "run"
      - "deploy"
      - "marketing"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/marketing/marketing:$BUILD_ID"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=marketing-cloud-run@$PROJECT_ID.iam.gserviceaccount.com"
      - "--add-cloudsql-instances=reading-advantage:asia-southeast1:cloud-sql"
      - "--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=https://marketing.reading-advantage.com,AI_PROVIDER=openai,COMPANY_AUTH_ISSUER_URL=https://accounts.reading-advantage.com,COMPANY_AUTH_OIDC_CLIENT_ID=marketing-web,COMPANY_AUTH_OIDC_REDIRECT_URI=https://marketing.reading-advantage.com/api/auth/callback,COMPANY_AUTH_EXPECTED_AUDIENCE=marketing,COMPANY_AUTH_CLOCK_SKEW_SECONDS=30"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--set-secrets=DATABASE_URL=MARKETING_DATABASE_URL:latest,ENCRYPTION_KEY=MARKETING_ENCRYPTION_KEY:latest,OPENAI_API_KEY=MARKETING_OPENAI_API_KEY:latest,GOOGLE_API_KEY=MARKETING_GOOGLE_API_KEY:latest,OPENROUTER_API_KEY=MARKETING_OPENROUTER_API_KEY:latest,COMPANY_AUTH_OIDC_CLIENT_SECRET=MARKETING_COMPANY_AUTH_OIDC_CLIENT_SECRET:latest"
      - "--tag=candidate-$BUILD_ID"
      - "--no-traffic"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "allow-public-invoker"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "marketing"
      - "--region=asia-southeast1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "capture-candidate"
    entrypoint: "bash"
    args:
      - "apps/marketing/scripts/capture-marketing-cloud-run-release.sh"
      - "candidate"
      - "candidate-$BUILD_ID"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/marketing/marketing:$BUILD_ID"
      - "/workspace/.marketing-candidate"

  - name: "node:22-slim"
    id: "verify-candidate"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export MARKETING_RELEASE_BASE_URL="$$(tr -d "\r\n" < /workspace/.marketing-candidate.url)" && pnpm --filter marketing exec tsx scripts/verify-marketing-release.ts'

  - name: "gcr.io/cloud-builders/gcloud"
    id: "promote-candidate"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && candidate_revision="$$(tr -d "\r\n" < /workspace/.marketing-candidate.revision)" && gcloud run services update-traffic marketing --region=asia-southeast1 --platform=managed --to-revisions="$$candidate_revision=100"'

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-domain-mapping"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && domain=marketing.reading-advantage.com && route="$$(gcloud beta run domain-mappings describe --domain="$$domain" --region=asia-southeast1 --platform=managed --format="value(metadata.annotations.''run.googleapis.com/routeName'')")" && test "$$route" = marketing && for condition in Ready CertificateProvisioned DomainRoutable; do status="$$(gcloud beta run domain-mappings describe --domain="$$domain" --region=asia-southeast1 --platform=managed --format="value(status.conditions[?type=''$$condition''].status)")"; test "$$status" = True; done'

  - name: "node:22-slim"
    id: "verify-custom-domain"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export MARKETING_RELEASE_BASE_URL=https://marketing.reading-advantage.com && verified=false && for attempt in $$(seq 1 12); do if pnpm --filter marketing exec tsx scripts/verify-marketing-release.ts; then verified=true; break; fi; sleep 5; done && test "$$verified" = true && bash apps/marketing/scripts/marketing-smoke.sh "$$MARKETING_RELEASE_BASE_URL"'

  - name: "gcr.io/cloud-builders/gcloud"
    id: "record-release-evidence"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && previous_revision="$$(tr -d "\r\n" < /workspace/.marketing-previous.revision)" && previous_image="$$(tr -d "\r\n" < /workspace/.marketing-previous.image)" && candidate_revision="$$(tr -d "\r\n" < /workspace/.marketing-candidate.revision)" && candidate_image="$$(tr -d "\r\n" < /workspace/.marketing-candidate.image)" && serving_revision="$$(gcloud run services describe marketing --region=asia-southeast1 --platform=managed --format="value(status.traffic[?percent=100].revisionName)")" && test "$$serving_revision" = "$$candidate_revision" && test "$$previous_revision" != "$$candidate_revision" && printf ''{"level":"info","event":"marketing_release_promoted","buildId":"%s","releaseCommitSha":"%s","previousRevision":"%s","previousImage":"%s","candidateRevision":"%s","candidateImage":"%s","rollbackCommand":"gcloud run services update-traffic marketing --region=asia-southeast1 --platform=managed --to-revisions=%s=100"}\n'' "$BUILD_ID" "$_RELEASE_COMMIT_SHA" "$$previous_revision" "$$previous_image" "$$candidate_revision" "$$candidate_image" "$$previous_revision"'

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/marketing/marketing:$BUILD_ID"

substitutions:
  _RELEASE_COMMIT_SHA: "REQUIRED_RELEASE_COMMIT_SHA"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/MARKETING_DIRECT_DATABASE_URL/versions/latest"
      env: "MARKETING_DIRECT_DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/MARKETING_DATABASE_URL/versions/latest"
      env: "MARKETING_DATABASE_URL"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
