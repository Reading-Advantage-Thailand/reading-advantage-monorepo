steps:
  - name: "node:22-slim"
    id: "validate-continuation-source"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && node apps/sales-advantage/scripts/release-source-manifest.mjs verify "$_CONTINUATION_COMMIT_SHA" /workspace /workspace/apps/sales-advantage/release-source.json "$_CONTINUATION_SOURCE_MANIFEST_SHA256"'

  - name: "gcr.io/cloud-builders/gcloud"
    id: "collect-original-release-evidence"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        mkdir -p /workspace/.sales-continuation-evidence
        gcloud builds describe f5063222-76bd-4b73-a151-3f7994827e09 --project="$PROJECT_ID" --format=json > /workspace/.sales-continuation-evidence/build.json
        gcloud sql backups describe 1784467579292 --instance=cloud-sql --project="$PROJECT_ID" --format=json > /workspace/.sales-continuation-evidence/backup.json
        gcloud artifacts docker images describe asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:f5063222-76bd-4b73-a151-3f7994827e09 --format=json > /workspace/.sales-continuation-evidence/artifact-response.json
        python3 -c "import json; response=json.load(open('/workspace/.sales-continuation-evidence/artifact-response.json')); json.dump({'requestedTag':'asia-southeast1-docker.pkg.dev/reading-advantage/sales-advantage/sales-advantage:f5063222-76bd-4b73-a151-3f7994827e09', **response}, open('/workspace/.sales-continuation-evidence/artifact.json','w'))"
        gcloud run services describe sales-advantage --project="$PROJECT_ID" --region=asia-southeast1 --platform=managed --format=json > /workspace/.sales-continuation-evidence/service.json
        gcloud run revisions describe sales-advantage-00004-jed --project="$PROJECT_ID" --region=asia-southeast1 --platform=managed --format=json > /workspace/.sales-continuation-evidence/rollback-revision.json
        gcloud run services get-iam-policy sales-advantage --project="$PROJECT_ID" --region=asia-southeast1 --platform=managed --format=json > /workspace/.sales-continuation-evidence/iam.json
        gcloud beta run domain-mappings describe --domain=sales.reading-advantage.com --project="$PROJECT_ID" --region=asia-southeast1 --platform=managed --format=json > /workspace/.sales-continuation-evidence/domain.json

  - name: "node:22-slim"
    id: "validate-original-release"
    entrypoint: "node"
    args:
      - "apps/sales-advantage/scripts/verify-sales-continuation.mjs"
      - "apps/sales-advantage/release-continuation-f5063222.json"
      - "/workspace/.sales-continuation-evidence"
      - "$_CONTINUATION_COMMIT_SHA"
      - "$_CONTINUATION_SOURCE_MANIFEST_SHA256"

  - name: "node:22-slim"
    id: "build-workspace-deps"
    entrypoint: "bash"
    args:
      - "-c"
      - "set -euo pipefail && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && pnpm --recursive --filter @reading-advantage/domain... --workspace-concurrency=2 --if-present run build"

  - name: "node:22-slim"
    id: "runtime-preflight"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq curl ca-certificates postgresql-client >/dev/null
        curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64
        chmod +x /usr/local/bin/cloud-sql-proxy
        mkdir -p /cloudsql
        cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &
        sleep 5
        corepack enable && corepack prepare pnpm@11.8.0 --activate
        export DATABASE_URL="$$SALES_DIRECT_DATABASE_URL"
        export DIRECT_DATABASE_URL="$$SALES_DIRECT_DATABASE_URL"
        pnpm --filter sales-advantage verify:production-curriculum
        cleanup() { psql "$$SALES_DIRECT_DATABASE_URL" --set=probe_owner="$BUILD_ID" -f apps/sales-advantage/scripts/sales-runtime-probe-cleanup.sql; }
        trap cleanup EXIT
        psql "$$SALES_DIRECT_DATABASE_URL" --set=probe_owner="$BUILD_ID" -f apps/sales-advantage/scripts/sales-runtime-probe-setup.sql
        psql "$$SALES_DATABASE_URL" --set=probe_owner="$BUILD_ID" -f apps/sales-advantage/scripts/sales-runtime-probe.sql
        psql "$$SALES_LEGACY_DATABASE_URL" --set=probe_owner="$BUILD_ID" -f apps/sales-advantage/scripts/sales-legacy-runtime-probe.sql
        manifest_sha256="$$(printf %s "$$SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST" | sha256sum | cut -d " " -f 1)"
        test "$$manifest_sha256" = "6329c846ac119a0af9fa43747879b042c211b4b79e5ad8a98822940fd29b5980"
        psql "$$SALES_DIRECT_DATABASE_URL" --set=repair_manifest="$$SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST" --set=repair_manifest_sha256="$$manifest_sha256" -f apps/sales-advantage/scripts/sales-continuation-preflight.sql
        cleanup
        trap - EXIT
    secretEnv:
      - "SALES_DIRECT_DATABASE_URL"
      - "SALES_DATABASE_URL"
      - "SALES_LEGACY_DATABASE_URL"
      - "SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-rollback-pre-repair"
    entrypoint: "python3"
    args:
      - "apps/sales-advantage/scripts/verify-sales-continuation-public.py"
      - "--mode"
      - "legacy-school"
      - "--revision"
      - "sales-advantage-00004-jed"
      - "--digest"
      - "sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3"
      - "--traffic"
      - "0"
      - "--tag"
      - "legacy-rollback"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-company-candidate"
    args:
      - "run"
      - "deploy"
      - "sales-advantage"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage@sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--service-account=sales-cloud-run@$PROJECT_ID.iam.gserviceaccount.com"
      - "--add-cloudsql-instances=reading-advantage:asia-southeast1:cloud-sql"
      - "--set-env-vars=NODE_ENV=production,SALES_AUTH_MODE=company,NEXT_PUBLIC_API_URL=https://sales.reading-advantage.com,COMPANY_AUTH_ISSUER_URL=https://accounts.reading-advantage.com,COMPANY_AUTH_OIDC_CLIENT_ID=sales-web,COMPANY_AUTH_OIDC_REDIRECT_URI=https://sales.reading-advantage.com/api/auth/callback,COMPANY_AUTH_EXPECTED_AUDIENCE=sales,COMPANY_AUTH_CLOCK_SKEW_SECONDS=30"
      - "--min-instances=1"
      - "--max-instances=100"
      - "--concurrency=80"
      - "--set-secrets=DATABASE_URL=SALES_DATABASE_URL:latest,COMPANY_AUTH_OIDC_CLIENT_SECRET=SALES_COMPANY_AUTH_OIDC_CLIENT_SECRET:latest,AI_PROVIDER=SALES_AI_PROVIDER:latest,OPENROUTER_API_KEY=SALES_OPENROUTER_API_KEY:latest,SALES_AUDIO_EVAL_MODEL=SALES_AUDIO_EVAL_MODEL:latest,SALES_AUDIO_EVAL_FALLBACK_STT_MODEL=SALES_AUDIO_EVAL_FALLBACK_STT_MODEL:latest,SALES_AUDIO_EVAL_FALLBACK_EVAL_MODEL=SALES_AUDIO_EVAL_FALLBACK_EVAL_MODEL:latest,SALES_CHAT_MODEL=SALES_CHAT_MODEL:latest,STORAGE_ENDPOINT=SALES_STORAGE_ENDPOINT:latest,STORAGE_REGION=SALES_STORAGE_REGION:latest,STORAGE_BUCKET=SALES_STORAGE_BUCKET:latest,STORAGE_ACCESS_KEY=SALES_STORAGE_ACCESS_KEY:latest,STORAGE_SECRET_KEY=SALES_STORAGE_SECRET_KEY:latest,STORAGE_PUBLIC_BASE_URL=SALES_STORAGE_PUBLIC_BASE_URL:latest"
      - "--tag=cf5063222"
      - "--no-traffic"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-company-candidate-pre-repair"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        candidate_revision="$$(gcloud run services describe sales-advantage --region=asia-southeast1 --platform=managed --format="value(status.traffic.filter(tag='cf5063222').extract(revisionName).flatten())")"
        test -n "$$candidate_revision"
        printf %s "$$candidate_revision" > /workspace/.sales-continuation-candidate
        python3 apps/sales-advantage/scripts/verify-sales-continuation-public.py --mode company --revision "$$candidate_revision" --digest sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3 --traffic 0 --tag cf5063222

  - name: "gcr.io/cloud-builders/gcloud"
    id: "shift-traffic-to-rollback"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "sales-advantage"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--to-revisions=sales-advantage-00004-jed=100"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-legacy-domain-pre-repair"
    entrypoint: "python3"
    args:
      - "apps/sales-advantage/scripts/verify-sales-continuation-public.py"
      - "--mode"
      - "legacy-school"
      - "--revision"
      - "sales-advantage-00004-jed"
      - "--digest"
      - "sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3"
      - "--traffic"
      - "100"
      - "--base-url"
      - "https://sales.reading-advantage.com"

  - name: "node:22-slim"
    id: "apply-source-role-repair"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq curl ca-certificates openssl postgresql-client >/dev/null
        curl -sSfL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.1/cloud-sql-proxy.linux.amd64
        chmod +x /usr/local/bin/cloud-sql-proxy
        mkdir -p /cloudsql
        cloud-sql-proxy --unix-socket /cloudsql reading-advantage:asia-southeast1:cloud-sql &
        sleep 5
        corepack enable && corepack prepare pnpm@11.8.0 --activate
        export BUILD_ID="$BUILD_ID"
        export SALES_LEGACY_ROLLBACK_URL="https://sales.reading-advantage.com"
        bash apps/sales-advantage/scripts/verify-legacy-rollback-release.sh
        manifest_sha256="$$(printf %s "$$SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST" | sha256sum | cut -d " " -f 1)"
        test "$$manifest_sha256" = "6329c846ac119a0af9fa43747879b042c211b4b79e5ad8a98822940fd29b5980"
        psql "$$SALES_DIRECT_DATABASE_URL" --set=repair_manifest="$$SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST" --set=repair_manifest_sha256="$$manifest_sha256" --set=release_build_id=f5063222-76bd-4b73-a151-3f7994827e09 --set=release_commit_sha=597241dedf712ea6a2350346fefa0459f3e1d23c -f apps/sales-advantage/scripts/sales-legacy-source-role-repair.sql
        psql "$$SALES_DIRECT_DATABASE_URL" --set=repair_manifest="$$SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST" -f apps/sales-advantage/scripts/sales-continuation-receipt-probe.sql
        bash apps/sales-advantage/scripts/verify-legacy-rollback-release.sh
    secretEnv:
      - "SALES_DIRECT_DATABASE_URL"
      - "SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-rollback-post-repair"
    entrypoint: "python3"
    args:
      - "apps/sales-advantage/scripts/verify-sales-continuation-public.py"
      - "--mode"
      - "legacy-school"
      - "--revision"
      - "sales-advantage-00004-jed"
      - "--digest"
      - "sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3"
      - "--traffic"
      - "100"
      - "--base-url"
      - "https://sales.reading-advantage.com"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-company-candidate-post-repair"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && candidate_revision="$$(tr -d "\r\n" < /workspace/.sales-continuation-candidate)" && python3 apps/sales-advantage/scripts/verify-sales-continuation-public.py --mode company --revision "$$candidate_revision" --digest sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3 --traffic 0 --tag cf5063222'

  - name: "gcr.io/cloud-builders/gcloud"
    id: "promote-company-candidate"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && export CANDIDATE_REVISION="$$(tr -d "\r\n" < /workspace/.sales-continuation-candidate)" && bash apps/sales-advantage/scripts/promote-sales-continuation.sh'

  - name: "node:22-slim"
    id: "emit-continuation-receipt"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        candidate_revision="$$(tr -d '\r\n' < /workspace/.sales-continuation-candidate)"
        printf '{"event":"sales_continuation_completed","originalBuildId":"f5063222-76bd-4b73-a151-3f7994827e09","originalCommitSha":"597241dedf712ea6a2350346fefa0459f3e1d23c","imageDigest":"sha256:ab7ca4d4429cad3d81a28fe9b9f85e03c78cb62f2e075142152982e0f7415ce3","backupId":"1784467579292","repairManifestSha256":"6329c846ac119a0af9fa43747879b042c211b4b79e5ad8a98822940fd29b5980","candidateRevision":"%s","rollbackCommand":"gcloud run services update-traffic sales-advantage --region=asia-southeast1 --to-revisions=sales-advantage-00004-jed=100"}\n' "$$candidate_revision"

substitutions:
  _CONTINUATION_COMMIT_SHA: "REQUIRED_CONTINUATION_COMMIT_SHA"
  _CONTINUATION_SOURCE_MANIFEST_SHA256: "REQUIRED_CONTINUATION_SOURCE_MANIFEST_SHA256"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/SALES_DIRECT_DATABASE_URL/versions/latest"
      env: "SALES_DIRECT_DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/SALES_DATABASE_URL/versions/latest"
      env: "SALES_DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/SALES_LEGACY_DATABASE_URL/versions/latest"
      env: "SALES_LEGACY_DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST/versions/1"
      env: "SALES_LEGACY_SOURCE_ROLE_REPAIR_MANIFEST"

options:
  env:
    - "pnpm_config_verify_deps_before_run=warn"
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
