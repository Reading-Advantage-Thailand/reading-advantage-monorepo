steps:
  # The push holds no database step (decision D7 of the track per_app_cicd_20261107). The new
  # revision must start against the old schema. The database steps run only in
  # cloudbuild-traffic.yaml, by hand, on Daniel's word.

  - name: "node:22-slim"
    id: "validate-release-inputs"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && validation_now="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" && node apps/sales-advantage/scripts/release-source-manifest.mjs verify "$_RELEASE_COMMIT_SHA" /workspace /workspace/apps/sales-advantage/release-source.json "$_RELEASE_SOURCE_MANIFEST_SHA256" && node apps/sales-advantage/scripts/verify-sales-release-inputs.mjs inputs "$_RELEASE_COMMIT_SHA" "$_CURRICULUM_BACKUP_NOT_BEFORE" "$$validation_now"'

  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-f"
      - "apps/sales-advantage/Dockerfile"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:$BUILD_ID"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:$BUILD_ID"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-legacy-rollback"
    args:
      - "run"
      - "deploy"
      - "sales-advantage"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:$BUILD_ID"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=sales-cloud-run@$PROJECT_ID.iam.gserviceaccount.com"
      - "--add-cloudsql-instances=reading-advantage:asia-southeast1:cloud-sql"
      - "--set-env-vars=NODE_ENV=production,SALES_AUTH_MODE=legacy-school,NEXT_PUBLIC_API_URL=https://sales.reading-advantage.com"
      - "--set-secrets=DATABASE_URL=SALES_LEGACY_DATABASE_URL:latest,AUTH_SECRET=SALES_AUTH_SECRET:latest,AI_PROVIDER=SALES_AI_PROVIDER:latest,OPENROUTER_API_KEY=SALES_OPENROUTER_API_KEY:latest,SALES_AUDIO_EVAL_MODEL=SALES_AUDIO_EVAL_MODEL:latest,SALES_AUDIO_EVAL_FALLBACK_MODEL=SALES_AUDIO_EVAL_FALLBACK_MODEL:latest,SALES_CHAT_MODEL=SALES_CHAT_MODEL:latest,STORAGE_ENDPOINT=SALES_STORAGE_ENDPOINT:latest,STORAGE_REGION=SALES_STORAGE_REGION:latest,STORAGE_BUCKET=SALES_STORAGE_BUCKET:latest,STORAGE_ACCESS_KEY=SALES_STORAGE_ACCESS_KEY:latest,STORAGE_SECRET_KEY=SALES_STORAGE_SECRET_KEY:latest,STORAGE_PUBLIC_BASE_URL=SALES_STORAGE_PUBLIC_BASE_URL:latest"
      - "--tag=legacy-rollback"
      - "--no-traffic"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-company-candidate"
    args:
      - "run"
      - "deploy"
      - "sales-advantage"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:$BUILD_ID"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=sales-cloud-run@$PROJECT_ID.iam.gserviceaccount.com"
      - "--add-cloudsql-instances=reading-advantage:asia-southeast1:cloud-sql"
      - "--set-env-vars=NODE_ENV=production,SALES_AUTH_MODE=company,NEXT_PUBLIC_API_URL=https://sales.reading-advantage.com,SALES_PREVIEW_ORIGINS=https://candidate---sales-advantage-$PROJECT_NUMBER.asia-southeast1.run.app,COMPANY_AUTH_ISSUER_URL=https://accounts.reading-advantage.com,COMPANY_AUTH_OIDC_CLIENT_ID=sales-web,COMPANY_AUTH_OIDC_REDIRECT_URI=https://sales.reading-advantage.com/api/auth/callback,COMPANY_AUTH_EXPECTED_AUDIENCE=sales,COMPANY_AUTH_CLOCK_SKEW_SECONDS=30"
      - "--min-instances=1"
      - "--max-instances=100"
      - "--concurrency=80"
      - "--set-secrets=DATABASE_URL=SALES_DATABASE_URL:latest,COMPANY_AUTH_OIDC_CLIENT_SECRET=SALES_COMPANY_AUTH_OIDC_CLIENT_SECRET:latest,AI_PROVIDER=SALES_AI_PROVIDER:latest,OPENROUTER_API_KEY=SALES_OPENROUTER_API_KEY:latest,SALES_AUDIO_EVAL_MODEL=SALES_AUDIO_EVAL_MODEL:latest,SALES_AUDIO_EVAL_FALLBACK_MODEL=SALES_AUDIO_EVAL_FALLBACK_MODEL:latest,SALES_CHAT_MODEL=SALES_CHAT_MODEL:latest,STORAGE_ENDPOINT=SALES_STORAGE_ENDPOINT:latest,STORAGE_REGION=SALES_STORAGE_REGION:latest,STORAGE_BUCKET=SALES_STORAGE_BUCKET:latest,STORAGE_ACCESS_KEY=SALES_STORAGE_ACCESS_KEY:latest,STORAGE_SECRET_KEY=SALES_STORAGE_SECRET_KEY:latest,STORAGE_PUBLIC_BASE_URL=SALES_STORAGE_PUBLIC_BASE_URL:latest"
      - "--tag=candidate"
      - "--no-traffic"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "allow-public-invoker"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "sales-advantage"
      - "--region=asia-southeast1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "capture-company-candidate"
    entrypoint: "bash"
    args:
      - "apps/sales-advantage/scripts/capture-sales-cloud-run-tag.sh"
      - "candidate"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:$BUILD_ID"
      - "/workspace/.sales-company-candidate"

  - name: "node:22-slim"
    id: "verify-company-candidate"
    entrypoint: "bash"
    args:
      - "-c"
      - 'set -euo pipefail && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && export SALES_RELEASE_BASE_URL="$$(tr -d "\r\n" < /workspace/.sales-company-candidate.url)" && export SALES_RELEASE_EXPECTED_MODE=company && pnpm --filter sales-advantage exec tsx scripts/verify-sales-release.ts'

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/sales-advantage/sales-advantage:$BUILD_ID"

substitutions:
  _RELEASE_COMMIT_SHA: "REQUIRED_RELEASE_COMMIT_SHA"
  _CURRICULUM_BACKUP_NOT_BEFORE: "REQUIRED_CURRICULUM_BACKUP_NOT_BEFORE"
  _RELEASE_SOURCE_MANIFEST_SHA256: "REQUIRED_RELEASE_SOURCE_MANIFEST_SHA256"

options:
  env:
    - "pnpm_config_verify_deps_before_run=warn"
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
