services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: reading-advantage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Transaction-mode connection pooler. Mirrors the production topology
  # (self-hosted PgBouncer fronting the VPS Postgres on GCP Cloud Run).
  #
  # Sizing math (FR-1, track connection_pooling_20260522):
  #   - postgres:16-alpine default max_connections = 100
  #   - Distinct runtime (db, user) pairs locally = four product pairs plus
  #     company_identity x company_identity_runtime = 5 pools
  #   - default_pool_size = 15  ->  worst-case backend conns = 15 x 5 = 75
  #     (leaves >=25 headroom for migrations / direct connections / psql)
  #   - max_client_conn = 200   ->  ample headroom for concurrent dev processes
  #
  # Apps connect via DATABASE_URL on port 6432 (pooled, transaction mode).
  # Migrations + LISTEN/NOTIFY connect via DIRECT_DATABASE_URL on port 5432
  # (direct, session mode) -- see FR-3, FR-4.
  pgbouncer:
    # Bitnami removed this historical tag from ECR Public in June 2026; the
    # pinned legacy registry preserves the reviewed 1.23.1 local-dev image.
    image: docker.io/bitnamilegacy/pgbouncer:1.23.1
    container_name: reading-advantage-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      # Wildcard auth: any database name resolves to the postgres backend.
      # Local dev only -- production deploys an explicit pgbouncer.ini.
      PGBOUNCER_DATABASE: "*"
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "15"
      # Resolve short-lived local test roles from PostgreSQL so the transaction
      # pool exercises the real runtime login instead of a static user list.
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_USER: postgres
      PGBOUNCER_AUTH_QUERY: "SELECT usename, passwd FROM pg_catalog.pg_shadow WHERE usename = $$1"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "extra_float_digits,search_path"
      PGBOUNCER_BIND_ADDRESS: "0.0.0.0"
    ports:
      - "6432:6432"
    healthcheck:
      # bitnami's pgbouncer image does not ship pg_isready; use psql against the
      # admin `pgbouncer` DB instead (idiomatic for PgBouncer, faster than a
      # full backend handshake).
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=postgres psql -h 127.0.0.1 -p 6432 -U postgres -d pgbouncer -tAc 'SHOW VERSION;' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
