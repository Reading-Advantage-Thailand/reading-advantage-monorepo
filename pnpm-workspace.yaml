packages:
  - "apps/*"
  - "packages/*"
  - "packages/integrations/*"

overrides:
  drizzle-orm: 0.45.2
  next: 16.2.9
  react: 19.2.7
  react-dom: 19.2.7
  vitest: 4.1.8

peerDependencyRules:
  ignoreMissing: [ "@prisma/client", prisma ]
  allowAny: [ "@prisma/client", prisma ]

allowBuilds: { '@commitlint/cli': true, '@commitlint/config-conventional': true, '@ffmpeg-installer/linux-x64': true, '@ffprobe-installer/linux-x64': true, '@firebase/util': true, '@parcel/watcher': true, '@prisma/client': true, '@prisma/engines': true, '@revideo/telemetry': true, '@sentry/cli': true, '@swc/core': true, esbuild: true, prisma: true, protobufjs: true, puppeteer: true, sharp: true, unrs-resolver: true }

nodeLinker: hoisted

resolvePeersFromWorkspaceRoot: true
